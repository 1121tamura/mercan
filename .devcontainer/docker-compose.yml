version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      # claudeの履歴保持のためのボリュームマウント
      - ~/.claude:/root/.claude
    ports:
      - "8000:8000"
      - "5173:5173"
